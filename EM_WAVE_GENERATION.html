<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Blackbody Oscillator</title>
    <style>
        :root {
            --bg-color: #111;
            --panel-bg: #222;
            --text-color: #eee;
            --e-color: #4a90e2; /* Blue for Electric Field */
            --b-color: #e24a4a; /* Red for Magnetic Field */
            --wall-color: #444;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #controls {
            background-color: var(--panel-bg);
            padding: 20px;
            border-top: 2px solid #333;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a1a1a;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        input[type="range"] {
            width: 150px;
            accent-color: #fff;
        }

        .toggle-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .toggle-btn:hover { background: #444; }
        .toggle-btn.active.e-btn { background: var(--e-color); }
        .toggle-btn.active.b-btn { background: var(--b-color); }

        button#playPause {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button#playPause.paused { background: #e67e22; }

        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(34, 34, 34, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            pointer-events: none;
        }
        .legend p { margin: 5px 0; font-size: 14px; }
        .color-box {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border-radius: 2px;
        }

        #copyright-footer {
            background-color: var(--bg-color);
            color: #888;
            font-size: 12px;
            text-align: center;
            padding: 6px 10px;
            border-top: 1px solid #222;
            user-select: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
        <div class="legend">
            <p><span class="color-box" style="background: var(--e-color);"></span> <b>E-Field</b> (Vertical XY Plane)</p>
            <p><span class="color-box" style="background: var(--b-color);"></span> <b>B-Field</b> (Horizontal XZ Plane)</p>
            <p id="status-text" style="color: #aaa; margin-top: 10px; font-style: italic;">Status: Oscillating</p>
        </div>
    </div>

    <div id="controls">
        <button id="playPause">Pause</button>
        
        <div class="control-group">
            <label for="freqSlider">Vibration Frequency:</label>
            <input type="range" id="freqSlider" min="0" max="100" value="50">
            <span id="freqValue" style="width: 30px; text-align: right;">50</span>
        </div>

        <div class="control-group">
            <label>Show Fields:</label>
            <button class="toggle-btn active e-btn" id="toggleE">E-Field</button>
            <button class="toggle-btn active b-btn" id="toggleB">B-Field</button>
        </div>
    </div>

    <div id="copyright-footer">
        © All rights reserved. Dr. Ch. Suresh Babu, Associate Professor in Chemistry, Vasireddy Venkatadri International Technological University. Mobile: 9000837556, Email: sureshbabuchallari@gmail.com
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const freqSlider = document.getElementById('freqSlider');
        const freqValue = document.getElementById('freqValue');
        const toggleEBtn = document.getElementById('toggleE');
        const toggleBBtn = document.getElementById('toggleB');
        const playPauseBtn = document.getElementById('playPause');
        const statusText = document.getElementById('status-text');

        // State Variables
        let width, height;
        let isPlaying = true;
        let showE = true;
        let showB = true;
        let targetFrequency = 50;
        let currentFrequency = 50;
        
        // Physics & Animation constants
        let phase = 0;
        const waveSpeed = 4; // Horizontal propagation speed
        const amplitude = 80;
        let particleY = 0;
        
        // Store past positions to create the traveling wave
        // Format: { x: current_x_pos, amplitudeFactor: value_from_-1_to_1 }
        let waveHistory = [];
        
        // 3D Projection Constants (Pseudo-isometric)
        const projConfig = {
            scale: 1,
            originX: 300,
            originY: 0, // Will be set to center height
            xCos: 1, xSin: 0,       // X axis points right
            zCos: -0.6, zSin: 0.4   // Z axis points down-left (out of screen)
        };

        function resize() {
            const footerHeight = document.getElementById('copyright-footer').offsetHeight;
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight - document.getElementById('controls').offsetHeight - footerHeight;
            projConfig.originY = height / 2;
            
            // Adjust origin X based on screen size
            projConfig.originX = Math.min(300, width * 0.25);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 3D Projection Engine (No Libraries Needed) ---
        function project3D(x, y, z) {
            // Map 3D coordinates to 2D Canvas coordinates
            const px = projConfig.originX + (x * projConfig.xCos) + (z * projConfig.zCos);
            const py = projConfig.originY - y + (x * projConfig.xSin) + (z * projConfig.zSin);
            return { x: px, y: py };
        }

        function drawLine3D(x1, y1, z1, x2, y2, z2, color, lineWidth = 2, isDashed = false) {
            const p1 = project3D(x1, y1, z1);
            const p2 = project3D(x2, y2, z2);
            ctx.beginPath();
            if (isDashed) ctx.setLineDash([5, 5]);
            else ctx.setLineDash([]);
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawArrow3D(x, y, z, dx, dy, dz, color) {
            const headLength = 6;
            const start = project3D(x, y, z);
            const end = project3D(x + dx, y + dy, z + dz);
            
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Simple 2D arrowhead at the projected end point
            const angle = Math.atan2(end.y - start.y, end.x - start.x);
            ctx.beginPath();
            ctx.moveTo(end.x, end.y);
            ctx.lineTo(end.x - headLength * Math.cos(angle - Math.PI/6), end.y - headLength * Math.sin(angle - Math.PI/6));
            ctx.lineTo(end.x - headLength * Math.cos(angle + Math.PI/6), end.y - headLength * Math.sin(angle + Math.PI/6));
            ctx.lineTo(end.x, end.y);
            ctx.fillStyle = color;
            ctx.fill();
        }

        // --- Main Simulation Loop ---
        function update() {
            if (isPlaying) {
                // Smoothly interpolate current frequency towards target slider value
                currentFrequency += (targetFrequency - currentFrequency) * 0.1;
                
                // Calculate angular velocity based on frequency
                // If freq is 0, we decay the current phase amplitude to zero (particle stops)
                if (currentFrequency < 1) {
                    particleY *= 0.90; // Dampen to zero quickly
                    statusText.innerText = "Status: Thermal Oscillation Ceased (No EM Wave)";
                    statusText.style.color = "#ff6b6b";
                } else {
                    const angularVel = (currentFrequency * 0.002);
                    phase += angularVel;
                    particleY = Math.sin(phase); // Value from -1 to 1
                    statusText.innerText = `Status: Oscillating at ${Math.round(currentFrequency)} THz`;
                    statusText.style.color = "#a8ffb2";
                }

                // Move existing wave history forward
                for (let i = 0; i < waveHistory.length; i++) {
                    waveHistory[i].x += waveSpeed;
                }

                // Inject new particle position into wave history at X=0
                waveHistory.unshift({
                    x: 0,
                    amp: particleY
                });

                // Remove points that have gone off-screen to save memory
                // Max length depends on waveSpeed and screen width
                const maxTravel = width * 1.5;
                while (waveHistory.length > 0 && waveHistory[waveHistory.length - 1].x > maxTravel) {
                    waveHistory.pop();
                }
            }
        }

        function draw() {
            // Clear screen
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg-color');
            ctx.fillRect(0, 0, width, height);

            // Draw Background Axes
            const axisLength = Math.max(width, 1000);
            drawLine3D(0, 0, 0, axisLength, 0, 0, '#555', 1); // X Axis (Propagation)
            drawLine3D(0, -200, 0, 0, 200, 0, '#555', 1);     // Y Axis (Vertical)
            drawLine3D(0, 0, -200, 0, 0, 200, '#555', 1);     // Z Axis (Depth)
            
            // Axis Labels
            const pX = project3D(width * 0.8, 10, 0);
            ctx.fillStyle = '#888';
            ctx.font = '16px Arial';
            ctx.fillText("Propagation (X)", pX.x, pX.y);

            // Draw Blackbody Wall (A plane at X=0)
            const wallSize = 250;
            const pTopLeft = project3D(0, wallSize, -wallSize);
            const pTopRight = project3D(0, wallSize, wallSize);
            const pBottomRight = project3D(0, -wallSize, wallSize);
            const pBottomLeft = project3D(0, -wallSize, -wallSize);
            
            ctx.beginPath();
            ctx.moveTo(pTopLeft.x, pTopLeft.y);
            ctx.lineTo(pTopRight.x, pTopRight.y);
            ctx.lineTo(pBottomRight.x, pBottomRight.y);
            ctx.lineTo(pBottomLeft.x, pBottomLeft.y);
            ctx.closePath();
            ctx.fillStyle = 'rgba(50, 50, 55, 0.8)';
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.stroke();

            // Label Wall
            const pWallText = project3D(0, wallSize - 20, -wallSize + 20);
            ctx.fillStyle = '#bbb';
            ctx.fillText("Cavity Wall", pWallText.x - 40, pWallText.y);

            // Draw Waves
            const eColor = getComputedStyle(document.body).getPropertyValue('--e-color').trim();
            const bColor = getComputedStyle(document.body).getPropertyValue('--b-color').trim();

            if (waveHistory.length > 1) {
                // Draw continuous Sine Wave Lines
                if (showE) {
                    ctx.beginPath();
                    const first = project3D(waveHistory[0].x, waveHistory[0].amp * amplitude, 0);
                    ctx.moveTo(first.x, first.y);
                    for (let i = 1; i < waveHistory.length; i++) {
                        const pt = project3D(waveHistory[i].x, waveHistory[i].amp * amplitude, 0);
                        ctx.lineTo(pt.x, pt.y);
                    }
                    ctx.strokeStyle = eColor;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                if (showB) {
                    ctx.beginPath();
                    const first = project3D(waveHistory[0].x, 0, waveHistory[0].amp * amplitude);
                    ctx.moveTo(first.x, first.y);
                    for (let i = 1; i < waveHistory.length; i++) {
                        const pt = project3D(waveHistory[i].x, 0, waveHistory[i].amp * amplitude);
                        ctx.lineTo(pt.x, pt.y);
                    }
                    ctx.strokeStyle = bColor;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // Draw Field Vectors (Arrows) at intervals
                const vectorSpacing = 15; // pixels between arrows
                let distanceAccumulator = 0;
                
                for (let i = 0; i < waveHistory.length - 1; i++) {
                    const p1 = waveHistory[i];
                    const p2 = waveHistory[i+1];
                    distanceAccumulator += (p2.x - p1.x);
                    
                    if (distanceAccumulator >= vectorSpacing) {
                        distanceAccumulator = 0;
                        // Only draw if amplitude is noticeable (not zero line)
                        if (Math.abs(p1.amp) > 0.05) {
                            if (showE) {
                                drawArrow3D(p1.x, 0, 0, 0, p1.amp * amplitude, 0, eColor);
                            }
                            if (showB) {
                                drawArrow3D(p1.x, 0, 0, 0, 0, p1.amp * amplitude, bColor);
                            }
                        }
                    }
                }
            }

            // Draw Charged Oscillator (Particle) at X=0
            // Get physical Y position (if freq is 0, particleY smoothly becomes 0)
            const physicalY = particleY * amplitude;
            const center = project3D(0, physicalY, 0);
            
            // Glow effect
            const gradient = ctx.createRadialGradient(center.x, center.y, 2, center.x, center.y, 20);
            gradient.addColorStop(0, '#fff');
            gradient.addColorStop(0.3, '#4a90e2');
            gradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(center.x, center.y, 20, 0, Math.PI * 2);
            ctx.fill();

            // Core particle
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(center.x, center.y, 5, 0, Math.PI * 2);
            ctx.fill();

            // Label Particle
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText("Electron", center.x + 15, center.y - 15);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // --- Event Listeners ---
        freqSlider.addEventListener('input', (e) => {
            targetFrequency = parseInt(e.target.value);
            freqValue.innerText = targetFrequency;
        });

        toggleEBtn.addEventListener('click', () => {
            showE = !showE;
            toggleEBtn.classList.toggle('active', showE);
        });

        toggleBBtn.addEventListener('click', () => {
            showB = !showB;
            toggleBBtn.classList.toggle('active', showB);
        });

        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playPauseBtn.innerText = "Pause";
                playPauseBtn.classList.remove('paused');
            } else {
                playPauseBtn.innerText = "Play";
                playPauseBtn.classList.add('paused');
            }
        });

        // Start Loop
        loop();

    </script>
</body>
</html>
